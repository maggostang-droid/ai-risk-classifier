name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"
      - name: Linter
        run: ruff check .
      - name: Tests
        run: pytest tests/ -v
