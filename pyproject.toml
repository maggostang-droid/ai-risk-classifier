[project]
name = "ai-act-validation-toolkit"
version = "0.1.0"
description = "EU-AI-Act-Risikoklassifizierung + metamorphe Validierung (Portfolio-Miniatur von Marco Stangs Promotionsthema)"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# portfolio_ui.py ist ein bewusst in jede Demo kopierter gemeinsamer Baustein
# (siehe Docstring dort). Wird sie hier umformatiert, driftet sie gegen die
# Kopien in den Schwesterrepos — deshalb bleibt sie unangetastet.
"portfolio_ui.py" = ["E501", "B905"]
